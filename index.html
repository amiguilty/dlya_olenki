<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Решите задачу</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #29272c;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           ВИДЕО СВЕРХУ
        ========================= */

        .top-video {
            position: absolute;
            left: 50%;
            top: calc(50% - 170px);
            transform: translate(-50%, -100%);
            width: 230px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #514d55;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            z-index: 3;
            pointer-events: none;
        }

        /* =========================
           ДИАЛОГ
        ========================= */

        .dialog {
            width: min(420px, calc(100vw - 40px));
            min-height: 210px;
            padding: 30px;
            background: #353238;
            border: 1px solid #514d55;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .question {
            color: #f2edf4;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        .answer-input {
            width: 100px;
            height: 48px;
            border: 2px solid #615c67;
            border-radius: 9px;
            outline: none;
            background: #29272c;
            color: #ffffff;
            font-size: 24px;
            text-align: center;
            margin-bottom: 18px;
        }

        .answer-input:focus {
            border-color: #e86aa8;
        }

        .answer-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button {
            min-width: 210px;
            min-height: 46px;
            padding: 10px 20px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        button.active {
            background: #f06ba9;
            color: #652c60;
        }

        button.active:hover {
            background: #ff79b7;
            transform: scale(1.02);
        }

        button:disabled {
            background: #5b5263;
            color: #ef72aa;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           НЕПРАВИЛЬНАЯ КАРТИНКА
        ========================= */

        .wrong-picture {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: min(500px, 80vw);
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
            z-index: 100;
        }

        .interaction-blocker {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: transparent;
            cursor: not-allowed;
        }

        /* =========================
           ПАДАЮЩИЕ ПАУКИ / ПАУТИНЫ
        ========================= */

        .falling-item {
            position: fixed;
            top: -100px;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            animation-name: fallDown;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fallDown {
            from {
                transform: translateY(0) rotate(0deg);
            }

            to {
                transform: translateY(115vh) rotate(360deg);
            }
        }

        /* =========================
           ПАДАЮЩИЕ ФОТО
        ========================= */

        .falling-photo {
            position: fixed;
            top: -120px;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.45);

            /* Без вращения */
            animation-name: photoRain;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes photoRain {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(115vh);
            }
        }

        /* =========================
           МОБИЛЬНЫЕ
        ========================= */

        @media (max-width: 750px) {
            .top-video {
                width: 190px;
                height: 107px;
                top: calc(50% - 165px);
            }

            .dialog {
                width: calc(100vw - 30px);
                padding: 25px 20px;
            }

            .question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ВИДЕО СВЕРХУ -->
    <video
        id="backgroundVideo"
        class="top-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="assets/video1.mp4" type="video/mp4">
    </video>

    <!-- ДИАЛОГ -->
    <div id="app"></div>

</div>


<!-- =========================
     АУДИО
========================= -->

<audio id="musicBack" loop preload="auto">
    <source src="assets/music_back.mp3" type="audio/mpeg">
</audio>

<audio id="musicClick" preload="auto">
    <source src="assets/music_click.mp3" type="audio/mpeg">
</audio>

<audio id="music1" preload="auto">
    <source src="assets/music1.mp3" type="audio/mpeg">
</audio>

<audio id="music2" preload="auto">
    <source src="assets/music2.mp3" type="audio/mpeg">
</audio>

<audio id="music3" preload="auto">
    <source src="assets/music3.mp3" type="audio/mpeg">
</audio>

<audio id="music4" preload="auto">
    <source src="assets/music4.mp3" type="audio/mpeg">
</audio>


<script>

    /* =========================
       ЗАДАЧИ
    ========================= */

    const tasks = [
        {
            question: "решите задачу: 2+2 =",
            answer: "4",
            music: "music1",
            picture: "assets/picture1.jpg"
        },
        {
            question: "решите задачу: 2*2 =",
            answer: "4",
            music: "music2",
            picture: "assets/picture2.jpg"
        },
        {
            question: "решите задачу: 2+2**2 =",
            answer: "6",
            music: "music3",
            picture: "assets/picture3.jpg"
        }
    ];


    let currentTask = 0;

    let interfaceLocked = false;

    let fallingInterval = null;
    let photoFallingInterval = null;

    let activeTimers = [];


    /* =========================
       АУДИО
    ========================= */

    const musicBack = document.getElementById("musicBack");
    const musicClick = document.getElementById("musicClick");


    /* =========================
       ЗАПУСК
    ========================= */

    window.addEventListener("load", () => {

        const video = document.getElementById("backgroundVideo");

        video.play().catch(() => {});

        startBackgroundMusic();

        showTask();

    });


    /* =========================
       ФОНОВАЯ МУЗЫКА
    ========================= */

    function startBackgroundMusic() {

        musicBack.volume = 0.35;

        musicBack.play().catch(() => {});

    }


    document.addEventListener("click", () => {

        if (musicBack.paused) {
            musicBack.play().catch(() => {});
        }

    });


    document.addEventListener("keydown", () => {

        if (musicBack.paused) {
            musicBack.play().catch(() => {});
        }

    });


    /* =========================
       ПОКАЗ ЗАДАЧИ
    ========================= */

    function showTask() {

        clearTimers();

        interfaceLocked = false;

        const task = tasks[currentTask];

        const app = document.getElementById("app");

        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    ${task.question}
                </div>

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    autocomplete="off"
                >

                <button
                    id="continueButton"
                    class="active"
                    disabled
                >
                    ПРОДОЛЖИТЬ
                </button>

            </div>
        `;


        const input = document.getElementById("answerInput");
        const button = document.getElementById("continueButton");


        /* Только одна цифра */

        input.addEventListener("input", () => {

            if (interfaceLocked) {
                return;
            }

            input.value =
                input.value
                    .replace(/[^0-9]/g, "")
                    .slice(0, 1);


            button.disabled =
                input.value !== task.answer;

        });


        /* Проверка неправильного ответа */

        input.addEventListener("input", () => {

            if (interfaceLocked) {
                return;
            }

            if (
                input.value.length === 1 &&
                input.value !== task.answer
            ) {

                checkAnswer();

            }

        });


        /* Enter */

        input.addEventListener("keydown", (event) => {

            if (interfaceLocked) {
                event.preventDefault();
                return;
            }

            if (event.key === "Enter") {

                if (!button.disabled) {
                    button.click();
                }

            }

        });


        /* Продолжить */

        button.addEventListener("click", () => {

            if (button.disabled || interfaceLocked) {
                return;
            }

            playClickSound();

            /*
             * После каждого активного клика
             * пауки/паутинки падают 3 секунды.
             */
            startFallingEmojis();


            currentTask++;


            if (currentTask < tasks.length) {

                showTask();

            } else {

                showReadyScreen();

            }

        });


        setTimeout(() => {

            if (!interfaceLocked) {
                input.focus();
            }

        }, 50);

    }


    /* =========================
       ПРОВЕРКА ОТВЕТА
    ========================= */

    function checkAnswer() {

        if (interfaceLocked) {
            return;
        }

        const input = document.getElementById("answerInput");

        if (!input) {
            return;
        }

        const task = tasks[currentTask];

        if (input.value === task.answer) {
            return;
        }


        playMusic(task.music);

        showWrongPicture(task.picture);

    }


    /* =========================
       КЛИК
    ========================= */

    function playClickSound() {

        musicClick.currentTime = 0;

        musicClick.play().catch(() => {});

    }


    /* =========================
       МУЗЫКА ОШИБКИ
    ========================= */

    function playMusic(id) {

        const audio = document.getElementById(id);

        if (!audio) {
            return;
        }

        audio.currentTime = 0;

        audio.play().catch(() => {});

    }


    /* =========================
       НЕПРАВИЛЬНАЯ КАРТИНКА
       РОВНО 3 СЕКУНДЫ
    ========================= */

    function showWrongPicture(src) {

        interfaceLocked = true;


        const input = document.getElementById("answerInput");

        if (input) {

            input.disabled = true;

            input.blur();

        }


        /* Блокируем весь экран */

        const blocker = document.createElement("div");

        blocker.className = "interaction-blocker";

        blocker.id = "interactionBlocker";

        document.body.appendChild(blocker);


        /* Показываем картинку */

        const img = document.createElement("img");

        img.src = src;

        img.className = "wrong-picture";

        img.id = "wrongPicture";

        document.body.appendChild(img);


        /*
         * Через 3 секунды всё возвращается.
         */

        const timer = setTimeout(() => {

            const picture =
                document.getElementById("wrongPicture");

            const block =
                document.getElementById("interactionBlocker");


            if (picture) {
                picture.remove();
            }

            if (block) {
                block.remove();
            }


            interfaceLocked = false;


            const newInput =
                document.getElementById("answerInput");


            if (newInput) {

                newInput.disabled = false;

                newInput.value = "";

                newInput.focus();

            }

        }, 3000);


        activeTimers.push(timer);

    }


    /* =========================
       "ВЫ ТОЧНО ГОТОВЫ?"
    ========================= */

    function showReadyScreen() {

        const app = document.getElementById("app");


        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    Вы точно готовы узнать это?
                </div>

                <button
                    id="yesButton"
                    class="active"
                >
                    ДА
                </button>

                <div style="height: 12px;"></div>

                <button disabled>
                    НЕТ МНЕ ПОХ
                </button>

            </div>
        `;


        const yesButton =
            document.getElementById("yesButton");


        yesButton.addEventListener("click", () => {

            if (interfaceLocked) {
                return;
            }

            playClickSound();

            startFallingEmojis();

            showWaitScreen();

        });

    }


    /* =========================
       "ЩА СЕК"
    ========================= */

    function showWaitScreen() {

        const app = document.getElementById("app");


        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    Ща сек
                </div>

            </div>
        `;


        const timer = setTimeout(() => {

            showPaymentScreen();

        }, 5000);


        activeTimers.push(timer);

    }


    /* =========================
       ОПЛАТА
    ========================= */

    function showPaymentScreen() {

        const app = document.getElementById("app");


        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    Ну всё, можно узнать
                </div>

                <button disabled>
                    УЗНАТЬ БЕСПЛАТНО
                </button>

                <div style="height: 12px;"></div>

                <button
                    id="paidButton"
                    class="active"
                >
                    УЗНАТЬ ЗА 10 ГРЫВЕНЬ
                </button>

            </div>
        `;


        const paidButton =
            document.getElementById("paidButton");


        paidButton.addEventListener("click", () => {

            if (interfaceLocked) {
                return;
            }

            playClickSound();


            /*
             * Пауки заканчиваются.
             * Начинается дождь из фотографий.
             */

            stopFallingEmojis();

            startFallingPhotos();

            showFinalScreen();

        });

    }


    /* =========================
       ФИНАЛ
    ========================= */

    function showFinalScreen() {

        playMusic("music4");


        const app = document.getElementById("app");


        app.innerHTML = `
            <div class="dialog">

                <img
                    src="assets/picture5.jpg"
                    style="
                        max-width: 100%;
                        max-height: 180px;
                        object-fit: contain;
                        border-radius: 10px;
                        margin-bottom: 18px;
                    "
                >

                <button
                    id="finalButton"
                    class="active"
                >
                    бля спасибо нахуй
                </button>

            </div>
        `;


        const finalButton =
            document.getElementById("finalButton");


        finalButton.addEventListener("click", () => {

            if (interfaceLocked) {
                return;
            }

            playClickSound();


            /*
             * Останавливаем дождь.
             */

            stopFallingPhotos();


            /*
             * Начинаем всё сначала.
             */

            restartEverything();

        });

    }


    /* =========================
       ПАУКИ / ПАУТИНКИ
       ПАДАЮТ ТОЛЬКО 3 СЕКУНДЫ
    ========================= */

    function startFallingEmojis() {

        stopFallingPhotos();

        stopFallingEmojis();


        const emojis = [
            "🕸️",
            "🕷️",
            "🕸️",
            "🕷️"
        ];


        fallingInterval = setInterval(() => {

            createFallingEmoji(
                emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                ]
            );

        }, 350);


        /*
         * Через 3 секунды полностью
         * прекращаем создание новых.
         */

        const timer = setTimeout(() => {

            stopFallingEmojis();

        }, 3000);


        activeTimers.push(timer);

    }


    function createFallingEmoji(emoji) {

        const item =
            document.createElement("div");


        item.className = "falling-item";

        item.textContent = emoji;


        const size =
            24 + Math.random() * 30;


        item.style.fontSize =
            size + "px";


        item.style.left =
            Math.random() * 100 + "vw";


        /*
         * Та же скорость:
         * 3-7 секунд падения.
         */

        const duration =
            3 + Math.random() * 4;


        item.style.animationDuration =
            duration + "s";


        document.body.appendChild(item);


        setTimeout(() => {

            item.remove();

        }, (duration + 0.5) * 1000);

    }


    function stopFallingEmojis() {

        if (fallingInterval) {

            clearInterval(fallingInterval);

            fallingInterval = null;

        }


        document
            .querySelectorAll(".falling-item")
            .forEach(item => item.remove());

    }


    /* =========================
       ФОТОГРАФИИ
       МЕДЛЕННЫЙ ДОЖДЬ
    ========================= */

    function startFallingPhotos() {

        stopFallingPhotos();


        const photos = [
            "assets/p1.jpg",
            "assets/p2.jpg",
            "assets/p3.jpg"
        ];


        /*
         * Первая фотография сразу.
         */

        createFallingPhoto(
            photos[
                Math.floor(
                    Math.random() * photos.length
                )
            ]
        );


        /*
         * Дальше фотографии падают
         * постоянно до финальной кнопки.
         */

        photoFallingInterval =
            setInterval(() => {

                createFallingPhoto(
                    photos[
                        Math.floor(
                            Math.random() * photos.length
                        )
                    ]
                );

            }, 600);

    }


    function createFallingPhoto(src) {

        const img =
            document.createElement("img");


        img.className = "falling-photo";

        img.src = src;


        /*
         * Размер немного больше,
         * чем был раньше.
         */

        const size =
            70 + Math.random() * 35;


        img.style.width =
            size + "px";


        img.style.height =
            size + "px";


        /*
         * Случайная позиция.
         */

        img.style.left =
            Math.random() *
            (100 - (size / window.innerWidth * 100))
            + "vw";


        /*
         * НИКАКОГО ВРАЩЕНИЯ.
         */


        /*
         * Медленный дождь:
         * каждая фотография падает
         * примерно 7-10 секунд.
         */

        const duration =
            7 + Math.random() * 3;


        img.style.animationDuration =
            duration + "s";


        document.body.appendChild(img);


        setTimeout(() => {

            img.remove();

        }, (duration + 0.5) * 1000);

    }


    function stopFallingPhotos() {

        if (photoFallingInterval) {

            clearInterval(photoFallingInterval);

            photoFallingInterval = null;

        }


        document
            .querySelectorAll(".falling-photo")
            .forEach(photo => photo.remove());

    }


    /* =========================
       ПЕРЕЗАПУСК
    ========================= */

    function restartEverything() {

        stopFallingEmojis();

        stopFallingPhotos();

        clearTimers();


        currentTask = 0;

        interfaceLocked = false;


        showTask();

    }


    /* =========================
       ОЧИСТКА ТАЙМЕРОВ
    ========================= */

    function clearTimers() {

        activeTimers.forEach(timer => {

            clearTimeout(timer);

        });


        activeTimers = [];


        const picture =
            document.getElementById("wrongPicture");


        if (picture) {
            picture.remove();
        }


        const blocker =
            document.getElementById("interactionBlocker");


        if (blocker) {
            blocker.remove();
        }

    }

</script>

</body>
</html>
```
