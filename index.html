<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #29272c;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* =========================
           ФОН
           ========================= */

        .background-pictures {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .background-picture {
            position: absolute;
            object-fit: cover;
            border-radius: 10px;
            opacity: 0.72;
        }

        .background-picture:nth-child(1) {
            left: 3%;
            top: 5%;
            width: 170px;
            height: 170px;
            transform: rotate(-8deg);
        }

        .background-picture:nth-child(2) {
            left: 23%;
            top: 3%;
            width: 145px;
            height: 145px;
            transform: rotate(6deg);
        }

        .background-picture:nth-child(3) {
            left: 48%;
            top: 6%;
            width: 175px;
            height: 175px;
            transform: rotate(-5deg);
        }

        .background-picture:nth-child(4) {
            right: 4%;
            top: 4%;
            width: 155px;
            height: 155px;
            transform: rotate(9deg);
        }

        .background-picture:nth-child(5) {
            left: 7%;
            top: 38%;
            width: 145px;
            height: 145px;
            transform: rotate(7deg);
        }

        .background-picture:nth-child(6) {
            right: 7%;
            top: 32%;
            width: 175px;
            height: 175px;
            transform: rotate(-7deg);
        }

        .background-picture:nth-child(7) {
            left: 1%;
            bottom: 4%;
            width: 165px;
            height: 165px;
            transform: rotate(-6deg);
        }

        .background-picture:nth-child(8) {
            left: 25%;
            bottom: 5%;
            width: 150px;
            height: 150px;
            transform: rotate(8deg);
        }

        .background-picture:nth-child(9) {
            left: 50%;
            bottom: 2%;
            width: 180px;
            height: 180px;
            transform: rotate(-4deg);
        }

        .background-picture:nth-child(10) {
            right: 2%;
            bottom: 5%;
            width: 160px;
            height: 160px;
            transform: rotate(7deg);
        }

        .background-picture:nth-child(11) {
            left: 37%;
            top: 30%;
            width: 125px;
            height: 125px;
            transform: rotate(-10deg);
        }

        .background-picture:nth-child(12) {
            right: 25%;
            bottom: 28%;
            width: 135px;
            height: 135px;
            transform: rotate(10deg);
        }

        /* =========================
           ВИДЕО
           ========================= */

        .top-video {
            position: absolute;
            left: 50%;
            top: calc(50% - 170px);
            transform: translate(-50%, -100%);
            width: 230px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #514d55;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            z-index: 3;
            pointer-events: none;
        }

        /* =========================
           КНОПКА МУЗЫКИ
           ========================= */

        .music-toggle {
            position: fixed;
            top: 14px;
            right: 14px;
            width: 42px;
            height: 32px;
            padding: 0;
            border: 1px solid #514d55;
            border-radius: 8px;
            background: #353238;
            color: #ff77b7;
            font-size: 17px;
            cursor: pointer;
            z-index: 200;
            transition: 0.15s ease;
        }

        .music-toggle:hover {
            background: #403b44;
        }

        /* =========================
           ДИАЛОГ
           ========================= */

        .dialog {
            width: min(420px, calc(100vw - 40px));
            min-height: 210px;
            padding: 30px;
            background: #353238;
            border: 1px solid #514d55;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .question {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .answer-input {
            width: 70px;
            height: 50px;
            border: 2px solid #514d55;
            border-radius: 10px;
            outline: none;
            background: #29272c;
            color: #ffffff;
            text-align: center;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .answer-input:focus {
            border-color: #ff77b7;
        }

        .button {
            min-width: 190px;
            min-height: 44px;
            padding: 10px 18px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .button.active {
            background: #ff77b7;
            color: #6b2a61;
        }

        .button.active:hover {
            filter: brightness(1.08);
        }

        .button:disabled {
            background: #51495b;
            color: #ff77b7;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .message {
            color: #ffffff;
            font-size: 20px;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        /* =========================
           ОШИБКА
           ========================= */

        .wrong-picture {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            max-width: min(500px, 80vw);
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
            z-index: 100;
        }

        .interaction-blocker {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: transparent;
            cursor: not-allowed;
        }

        /* =========================
           ПАУКИ И ПАУТИНА
           ========================= */

        .falling-item {
            position: fixed;
            top: -100px;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            animation-name: spiderFall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes spiderFall {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(calc(100vh + 150px));
            }
        }

        /* =========================
           ДОЖДЬ P1 P2 P3
           ========================= */

        .falling-photo {
            position: fixed;
            top: -200px;
            z-index: 5;
            pointer-events: none;
            user-select: none;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            animation-name: photoRain;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes photoRain {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(calc(100vh + 300px));
            }
        }

        /* =========================
           МОБИЛЬНЫЕ
           ========================= */

        @media (max-width: 750px) {
            .top-video {
                width: 190px;
                height: 107px;
                top: calc(50% - 165px);
            }

            .dialog {
                width: calc(100vw - 30px);
                padding: 25px 20px;
            }

            .question {
                font-size: 18px;
            }

            .background-picture {
                width: 115px !important;
                height: 115px !important;
            }

            .falling-photo {
                max-width: 145px;
            }
        }
    </style>
</head>

<script>

    /* =========================
       ЗАДАЧИ
       ========================= */

    const tasks = [

        {
            question: "реши задачу: 2+2 =",
            answer: "4",
            music: "music1",
            picture: "assets/picture1.jpg"
        },

        {
            question: "еще одну: 2*2 =",
            answer: "4",
            music: "music2",
            picture: "assets/picture2.jpg"
        },

        {
            question: "ахаха бля последняя: 2+2**2 =",
            answer: "6",
            music: "music3",
            picture: "assets/picture3.jpg"
        }

    ];


    /* =========================
       СОСТОЯНИЕ
       ========================= */

    let currentTask = 0;

    let interfaceLocked = false;

    let fallingInterval = null;

    let fallingStopTimer = null;

    let photoFallingInterval = null;

    let activeTimers = [];


    /* =========================
       ЭЛЕМЕНТЫ
       ========================= */

    const app =
        document.getElementById("app");

    const musicBack =
        document.getElementById("musicBack");

    const musicClick =
        document.getElementById("musicClick");

    const applePay =
        document.getElementById("applePay");

    const musicToggle =
        document.getElementById("musicToggle");


    let musicBackEnabled = true;


    /* =========================
       MUSIC_BACK
       ========================= */

    function startBackgroundMusic() {

        if (!musicBackEnabled) {
            return;
        }

        musicBack.volume = 0.35;

        musicBack
            .play()
            .catch(() => {});
    }


    function toggleBackgroundMusic() {

        if (musicBackEnabled) {

            musicBackEnabled = false;

            musicBack.pause();

            musicToggle.textContent = "🔇";

            musicToggle.title =
                "Включить музыку";

            musicToggle.setAttribute(
                "aria-label",
                "Включить музыку"
            );

        } else {

            musicBackEnabled = true;

            startBackgroundMusic();

            musicToggle.textContent = "🔊";

            musicToggle.title =
                "Выключить музыку";

            musicToggle.setAttribute(
                "aria-label",
                "Выключить музыку"
            );
        }
    }


    musicToggle.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();

            toggleBackgroundMusic();
        }
    );


    /*
     * Если браузер заблокировал
     * автоматическое воспроизведение,
     * пробуем включить музыку
     * после взаимодействия.
     */

    document.addEventListener(
        "click",
        () => {

            if (
                musicBackEnabled &&
                musicBack.paused
            ) {
                startBackgroundMusic();
            }

        }
    );


    document.addEventListener(
        "keydown",
        () => {

            if (
                musicBackEnabled &&
                musicBack.paused
            ) {
                startBackgroundMusic();
            }

        }
    );


    /* =========================
       MUSIC_CLICK
       ========================= */

    function playClickSound() {

        musicClick.currentTime = 0;

        musicClick.volume = 0.7;

        musicClick
            .play()
            .catch(() => {});
    }


    /* =========================
       APPLE PAY
       ========================= */

    function playApplePaySound() {

        applePay.currentTime = 0;

        applePay.volume = 1;

        applePay
            .play()
            .catch(() => {});
    }


    /* =========================
       ТАЙМЕРЫ
       ========================= */

    function clearTimers() {

        activeTimers.forEach(
            timer => clearTimeout(timer)
        );

        activeTimers = [];
    }


    /* =========================
       УБОРКА ОШИБКИ
       ========================= */

    function removeWrongScreen() {

        const picture =
            document.querySelector(
                ".wrong-picture"
            );

        const blocker =
            document.querySelector(
                ".interaction-blocker"
            );


        if (picture) {
            picture.remove();
        }


        if (blocker) {
            blocker.remove();
        }
    }


    /* =========================
       ПОКАЗ ЗАДАЧИ
       ========================= */

    function showTask() {

        interfaceLocked = false;

        removeWrongScreen();

        const task =
            tasks[currentTask];


        app.innerHTML = `

            <div class="dialog">

                <div class="question">
                    ${task.question}
                </div>


                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    autocomplete="off"
                >


                <button
                    id="continueButton"
                    class="button"
                    type="button"
                    disabled
                >
                    ПРОДОЛЖИТЬ
                </button>

            </div>

        `;


        const input =
            document.getElementById(
                "answerInput"
            );


        const button =
            document.getElementById(
                "continueButton"
            );


        input.focus();


        input.addEventListener(
            "input",
            () => {

                if (interfaceLocked) {
                    return;
                }


                /*
                 * Только одна цифра 0–9.
                 */

                input.value =
                    input.value
                        .replace(/[^0-9]/g, "")
                        .slice(0, 1);


                button.disabled =
                    input.value !== task.answer;

            }
        );


        input.addEventListener(
            "keydown",
            (event) => {

                if (interfaceLocked) {

                    event.preventDefault();

                    return;
                }


                if (
                    event.key === "Enter" &&
                    input.value === task.answer
                ) {

                    event.preventDefault();

                    checkAnswer();

                }

            }
        );


        button.addEventListener(
            "click",
            () => {

                if (interfaceLocked) {
                    return;
                }

                checkAnswer();

            }
        );
    }


    /* =========================
       ПРОВЕРКА ОТВЕТА
       ========================= */

    function checkAnswer() {

        if (interfaceLocked) {
            return;
        }


        const task =
            tasks[currentTask];


        const input =
            document.getElementById(
                "answerInput"
            );


        if (!input) {
            return;
        }


        /*
         * ПРАВИЛЬНЫЙ ОТВЕТ
         */

        if (
            input.value === task.answer
        ) {

            playClickSound();

            startFallingEmojis();

            currentTask++;


            if (
                currentTask <
                tasks.length
            ) {

                showTask();

            } else {

                showReadyScreen();

            }

            return;
        }


        /*
         * НЕПРАВИЛЬНЫЙ ОТВЕТ
         */

        showWrongAnswer(task);
    }


    /* =========================
       НЕПРАВИЛЬНЫЙ ОТВЕТ
       ========================= */

    function showWrongAnswer(task) {

        interfaceLocked = true;


        /*
         * Проигрываем
         * music1 / music2 / music3
         */

        const music =
            document.getElementById(
                task.music
            );


        if (music) {

            music.currentTime = 0;

            music.volume = 1;

            music
                .play()
                .catch(() => {});
        }


        /*
         * Полностью блокируем
         * страницу на 3 секунды.
         */

        const blocker =
            document.createElement("div");

        blocker.className =
            "interaction-blocker";

        document.body.appendChild(
            blocker
        );


        /*
         * Показываем
         * соответствующую картинку.
         */

        const picture =
            document.createElement("img");

        picture.className =
            "wrong-picture";

        picture.src =
            task.picture;

        picture.alt = "";

        document.body.appendChild(
            picture
        );


        /*
         * Ровно через 3 секунды
         * всё исчезает.
         */

        const timer =
            setTimeout(
                () => {

                    removeWrongScreen();

                    interfaceLocked = false;


                    const input =
                        document.getElementById(
                            "answerInput"
                        );


                    if (input) {

                        input.value = "";

                        input.focus();
                    }

                },
                3000
            );


        activeTimers.push(timer);
    }


    /* =========================
       ЭКРАН ГОТОВНОСТИ
       ========================= */

    function showReadyScreen() {

        app.innerHTML = `

            <div class="dialog">

                <div class="message">
                    Вы точно готовы узнать это?
                </div>


                <button
                    id="yesButton"
                    class="button active"
                    type="button"
                >
                    ДА
                </button>


                <div style="height: 10px;"></div>


                <button
                    class="button"
                    type="button"
                    disabled
                >
                    НЕТ МНЕ ПОХ
                </button>

            </div>

        `;


        document
            .getElementById("yesButton")
            .addEventListener(
                "click",
                () => {

                    playClickSound();

                    startFallingEmojis();

                    showWaitScreen();

                }
            );
    }


    /* =========================
       ЩА СЕК
       ========================= */

    function showWaitScreen() {

        app.innerHTML = `

            <div class="dialog">

                <div class="message">
                    Ща сек, ой загрузка...
                </div>

            </div>

        `;


        const timer =
            setTimeout(
                () => {

                    showPaymentScreen();

                },
                5000
            );


        activeTimers.push(timer);
    }


    /* =========================
       ОПЛАТА
       ========================= */

    function showPaymentScreen() {

        app.innerHTML = `

            <div class="dialog">

                <div class="message">
                    ты почти у цели))
                </div>


                <button
                    class="button"
                    type="button"
                    disabled
                >
                    УЗНАТЬ БЕСПЛАТНО
                </button>


                <div style="height: 10px;"></div>


                <button
                    id="paidButton"
                    class="button active"
                    type="button"
                >
                    УЗНАТЬ ЗА 10 ГРЫВЕНЬ
                </button>

            </div>

        `;


        document
            .getElementById("paidButton")
            .addEventListener(
                "click",
                () => {

                    /*
                     * ВАЖНО:
                     * music_click.mp3 здесь НЕ запускается.
                     */

                    playApplePaySound();


                    /*
                     * Пауки исчезают.
                     */

                    stopFallingEmojis();


                    /*
                     * Запускаем дождь.
                     */

                    startFallingPhotos();


                    /*
                     * Финальный экран.
                     */

                    showFinalScreen();

                }
            );
    }


    /* =========================
       ФИНАЛ
       ========================= */

    function showFinalScreen() {

        const music4 =
            document.getElementById(
                "music4"
            );


        if (music4) {

            music4.currentTime = 0;

            music4.volume = 1;

            music4
                .play()
                .catch(() => {});
        }


        app.innerHTML = `

            <div class="dialog">

                <img
                    src="assets/picture5.jpg"
                    alt=""
                    style="
                        max-width: 100%;
                        max-height: 230px;
                        object-fit: contain;
                        border-radius: 10px;
                        margin-bottom: 20px;
                    "
                >


                <button
                    id="finalButton"
                    class="button active"
                    type="button"
                >
                    бля спасибо нахуй
                </button>

            </div>

        `;


        document
            .getElementById("finalButton")
            .addEventListener(
                "click",
                () => {

                    playClickSound();

                    stopFallingPhotos();

                    stopFallingEmojis();

                    restartEverything();

                }
            );
    }


    /* =========================
       ПАУКИ / ПАУТИНА
       =========================
       
       Весь эффект длится ровно 3 секунды.
       ========================= */

    function startFallingEmojis() {

        stopFallingPhotos();

        stopFallingEmojis();


        const emojis = [

            "🕷️",
            "🕸️",
            "🕷",
            "🕸",
            "🕷️"

        ];


        function createFallingEmoji() {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "falling-item";


            item.textContent =
                emojis[
                    Math.floor(
                        Math.random() *
                        emojis.length
                    )
                ];


            const size =
                24 +
                Math.random() * 30;


            const duration =
                3 +
                Math.random() * 4;


            item.style.left =
                Math.random() * 100 +
                "vw";


            item.style.fontSize =
                size + "px";


            item.style.animationDuration =
                duration + "s";


            document.body.appendChild(
                item
            );
        }


        createFallingEmoji();


        fallingInterval =
            setInterval(
                () => {

                    createFallingEmoji();

                },
                350
            );


        /*
         * Ровно через 3 секунды
         * полностью прекращаем эффект.
         */

        fallingStopTimer =
            setTimeout(
                () => {

                    stopFallingEmojis();

                },
                3000
            );
    }


    function stopFallingEmojis() {

        if (fallingInterval) {

            clearInterval(
                fallingInterval
            );

            fallingInterval = null;
        }


        if (fallingStopTimer) {

            clearTimeout(
                fallingStopTimer
            );

            fallingStopTimer = null;
        }


        document
            .querySelectorAll(
                ".falling-item"
            )
            .forEach(
                item => item.remove()
            );
    }


    /* =========================
       ДОЖДЬ P1 / P2 / P3
       ========================= */

    function startFallingPhotos() {

        stopFallingPhotos();


        const photos = [

            "assets/p1.jpg",
            "assets/p2.jpg",
            "assets/p3.jpg"

        ];


        let photoIndex = 0;


        function createFallingPhoto() {

            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "falling-photo";


            image.src =
                photos[photoIndex];


            photoIndex =
                (
                    photoIndex + 1
                ) %
                photos.length;


            /*
             * Большой размер,
             * чтобы текст хорошо читался.
             */

            const size =
                110 +
                Math.random() * 40;


            image.style.width =
                size + "px";


            image.style.height =
                "auto";


            /*
             * Случайное положение
             * по горизонтали.
             */

            const maxLeft =
                Math.max(
                    0,
                    window.innerWidth - size
                );


            image.style.left =
                Math.random() *
                maxLeft +
                "px";


            /*
             * Очень медленное падение:
             * 9–13 секунд.
             */

            const duration =
                9 +
                Math.random() * 4;


            image.style.animationDuration =
                duration + "s";


            /*
             * Никакого вращения.
             */

            document.body.appendChild(
                image
            );


            image.addEventListener(
                "animationend",
                () => {

                    image.remove();

                }
            );
        }


        /*
         * Первая картинка сразу.
         */

        createFallingPhoto();


        /*
         * Затем спокойный дождь.
         */

        photoFallingInterval =
            setInterval(
                () => {

                    createFallingPhoto();

                },
                700
            );
    }


    function stopFallingPhotos() {

        if (photoFallingInterval) {

            clearInterval(
                photoFallingInterval
            );

            photoFallingInterval = null;
        }


        document
            .querySelectorAll(
                ".falling-photo"
            )
            .forEach(
                photo => photo.remove()
            );
    }


    /* =========================
       ПЕРЕЗАПУСК
       ========================= */

    function restartEverything() {

        stopFallingEmojis();

        stopFallingPhotos();

        clearTimers();

        removeWrongScreen();


        currentTask = 0;

        interfaceLocked = false;


        showTask();
    }


    /* =========================
       ЗАПУСК
       ========================= */

    window.addEventListener(
        "load",
        () => {

            const video =
                document.getElementById(
                    "backgroundVideo"
                );


            video
                .play()
                .catch(() => {});


            startBackgroundMusic();

            showTask();

        }
    );

</script>
