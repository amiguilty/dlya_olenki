<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Задачка</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #29272c;
            color: #f3a8d0;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .dialog {
            width: min(420px, calc(100vw - 40px));
            min-height: 210px;

            background: #3a373d;
            border: 2px solid #514d55;
            border-radius: 14px;

            padding: 30px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);

            position: relative;
            z-index: 10;

            animation: dialogAppear 0.25s ease;
        }

        @keyframes dialogAppear {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .question {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 22px;
            color: #f2a5cd;
        }

        .answer-input {
            width: 90px;
            height: 52px;

            background: #29272c;
            color: #f3a8d0;

            border: 2px solid #716b76;
            border-radius: 9px;

            text-align: center;
            font-size: 25px;
            font-weight: bold;

            outline: none;

            margin-bottom: 18px;
        }

        .answer-input:focus {
            border-color: #e78bb8;
            box-shadow: 0 0 0 3px rgba(231, 139, 184, 0.12);
        }

        button {
            width: 100%;
            max-width: 280px;

            height: 48px;

            border: none;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        .active-button {
            background: #f08fbd;
            color: #6b2760;
        }

        .active-button:hover {
            background: #f5a2c9;
        }

        button:disabled {
            background: #625b6d;
            color: #e99ac3;
            cursor: not-allowed;
            opacity: 0.9;
        }

        #continueBtn {
            margin-top: 2px;
        }

        .wrong-picture {
            position: fixed;

            max-width: min(260px, 70vw);
            max-height: 260px;

            object-fit: contain;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 100;

            border-radius: 12px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);

            animation: pictureAppear 0.2s ease;
        }

        @keyframes pictureAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .wait-text {
            font-size: 26px;
            font-weight: bold;
            color: #f2a5cd;
            text-align: center;
        }

        .final-dialog {
            min-height: 300px;
        }

        .final-picture {
            width: 100%;
            max-width: 300px;
            max-height: 230px;

            object-fit: contain;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .falling-item {
            position: fixed;

            top: -100px;

            z-index: 5;

            pointer-events: none;

            user-select: none;

            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.95;
            }
        }

        @media (max-width: 500px) {

            .dialog {
                padding: 25px 20px;
            }

            .question {
                font-size: 21px;
            }

            .wait-text {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div id="app"></div>
</div>


<!-- ============================================================
     ЗВУКИ
     ============================================================ -->

<audio id="musicBack"
       src="assets/music_back.mp3"
       preload="auto"
       loop>
</audio>

<audio id="musicClick"
       src="assets/music_click.mp3"
       preload="auto">
</audio>

<audio id="music1"
       src="assets/music1.mp3"
       preload="auto">
</audio>

<audio id="music2"
       src="assets/music2.mp3"
       preload="auto">
</audio>

<audio id="music3"
       src="assets/music3.mp3"
       preload="auto">
</audio>

<audio id="music4"
       src="assets/music4.mp3"
       preload="auto">
</audio>


<script>

    /*
     * ============================================================
     * ЗАДАЧИ
     * ============================================================
     */

    const tasks = [

        {
            question: "решите задачу: 2+2 =",
            answer: "4",
            music: "music1",
            picture: "picture1.png"
        },

        {
            question: "решите задачу: 2*2 =",
            answer: "4",
            music: "music2",
            picture: "picture2.png"
        },

        {
            question: "решите задачу: 2+2**2 =",
            answer: "6",
            music: "music3",
            picture: "picture3.png"
        }

    ];


    /*
     * ============================================================
     * СОСТОЯНИЕ
     * ============================================================
     */

    let currentTask = 0;

    let wrongPictureTimer = null;

    let waitTimer = null;

    let fallingInterval = null;

    /*
     * Был ли пользователь уже взаимодействовал
     * со страницей.
     */
    let musicStarted = false;


    const app = document.getElementById("app");


    /*
     * ============================================================
     * ФОНОВАЯ МУЗЫКА
     * ============================================================
     */

    function startBackgroundMusic() {

        const musicBack =
            document.getElementById("musicBack");

        if (!musicBack) {
            return;
        }

        /*
         * Если музыка уже играет — ничего не делаем.
         */
        if (!musicBack.paused) {
            return;
        }

        const promise = musicBack.play();

        if (promise !== undefined) {

            promise
                .then(() => {

                    musicStarted = true;

                })
                .catch(() => {

                    /*
                     * Браузер мог заблокировать autoplay.
                     * Следующее действие пользователя
                     * попробует запустить музыку снова.
                     */

                });
        }
    }


    /*
     * ============================================================
     * ЗАПУСК ФОНОВОЙ МУЗЫКИ ПРИ ПЕРВОМ ДЕЙСТВИИ
     * ============================================================
     */

    document.addEventListener("click", startBackgroundMusic);

    document.addEventListener("keydown", startBackgroundMusic);

    document.addEventListener("touchstart", startBackgroundMusic);


    /*
     * ============================================================
     * ПОКАЗ ПЕРВОЙ ЗАДАЧИ
     * ============================================================
     */

    showTask();


    /*
     * ============================================================
     * ПОКАЗ ЗАДАЧИ
     * ============================================================
     */

    function showTask() {

        clearTimers();

        const task = tasks[currentTask];

        app.innerHTML = `

            <div class="dialog">

                <div class="question">
                    ${task.question}
                </div>

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >

                <button
                    id="continueBtn"
                    disabled
                >
                    ПРОДОЛЖИТЬ
                </button>

            </div>
        `;


        const input =
            document.getElementById("answerInput");

        const continueBtn =
            document.getElementById("continueBtn");


        /*
         * ========================================================
         * ВВОД ОТВЕТА
         * ========================================================
         */

        input.addEventListener("input", function () {

            startBackgroundMusic();

            this.value =
                this.value
                    .replace(/[^0-9]/g, "");

            if (this.value.length > 1) {

                this.value =
                    this.value.charAt(0);

            }

            checkAnswer();
        });


        /*
         * ========================================================
         * КЛАВИАТУРА
         * ========================================================
         */

        input.addEventListener("keydown", function (event) {

            const allowedKeys = [

                "Backspace",
                "Delete",
                "ArrowLeft",
                "ArrowRight",
                "Tab"

            ];

            if (
                allowedKeys.includes(event.key) ||
                /^[0-9]$/.test(event.key)
            ) {

                return;

            }

            event.preventDefault();
        });


        /*
         * ========================================================
         * ВСТАВКА
         * ========================================================
         */

        input.addEventListener("paste", function (event) {

            event.preventDefault();

            startBackgroundMusic();

            const pastedText =
                (event.clipboardData ||
                 window.clipboardData)
                .getData("text");

            const digit =
                pastedText
                    .replace(/[^0-9]/g, "")
                    .charAt(0);

            this.value = digit;

            checkAnswer();
        });


        /*
         * ========================================================
         * КНОПКА ПРОДОЛЖИТЬ
         * ========================================================
         */

        continueBtn.addEventListener("click", function () {

            if (this.disabled) {
                return;
            }


            /*
             * Запускаем фоновую музыку,
             * если браузер ещё не разрешил её.
             */
            startBackgroundMusic();


            /*
             * Звук клика.
             */
            playClickSound();


            /*
             * Следующая задача.
             */
            currentTask++;


            if (currentTask >= tasks.length) {

                showReadyScreen();

            } else {

                showTask();

            }

        });


        /*
         * Автоматический фокус.
         */
        setTimeout(() => {

            input.focus();

        }, 100);

    }


    /*
     * ============================================================
     * ПРОВЕРКА ОТВЕТА
     * ============================================================
     */

    function checkAnswer() {

        const input =
            document.getElementById("answerInput");

        const continueBtn =
            document.getElementById("continueBtn");


        if (!input || !continueBtn) {
            return;
        }


        const value = input.value;


        /*
         * ПРАВИЛЬНЫЙ ОТВЕТ
         */

        if (value === tasks[currentTask].answer) {

            continueBtn.disabled = false;

            continueBtn.classList.add(
                "active-button"
            );

            return;
        }


        /*
         * Пустое поле.
         */

        if (value === "") {

            continueBtn.disabled = true;

            continueBtn.classList.remove(
                "active-button"
            );

            return;
        }


        /*
         * НЕПРАВИЛЬНЫЙ ОТВЕТ
         */

        continueBtn.disabled = true;

        continueBtn.classList.remove(
            "active-button"
        );


        /*
         * Проигрываем соответствующий
         * неправильный звук.
         */

        playMusic(
            tasks[currentTask].music
        );


        /*
         * Показываем соответствующую картинку.
         */

        showWrongPicture(
            tasks[currentTask].picture
        );


        /*
         * Очищаем поле.
         */

        setTimeout(() => {

            const currentInput =
                document.getElementById(
                    "answerInput"
                );

            if (currentInput) {

                currentInput.value = "";

                currentInput.focus();

            }

        }, 100);

    }


    /*
     * ============================================================
     * ЗВУК АКТИВНОЙ КНОПКИ
     * ============================================================
     */

    function playClickSound() {

        const audio =
            document.getElementById(
                "musicClick"
            );

        if (!audio) {
            return;
        }


        audio.currentTime = 0;


        const promise =
            audio.play();


        if (promise !== undefined) {

            promise.catch(() => {});

        }

    }


    /*
     * ============================================================
     * ОБЫЧНАЯ МУЗЫКА
     * ============================================================
     */

    function playMusic(id) {

        const audio =
            document.getElementById(id);

        if (!audio) {
            return;
        }


        audio.currentTime = 0;


        const promise =
            audio.play();


        if (promise !== undefined) {

            promise.catch(() => {});

        }

    }


    /*
     * ============================================================
     * НЕПРАВИЛЬНАЯ КАРТИНКА
     * ============================================================
     */

    function showWrongPicture(filename) {

        clearTimeout(
            wrongPictureTimer
        );


        const oldPicture =
            document.querySelector(
                ".wrong-picture"
            );


        if (oldPicture) {
            oldPicture.remove();
        }


        const img =
            document.createElement("img");


        img.src =
            "assets/" + filename;


        img.className =
            "wrong-picture";


        img.onerror =
            function () {

                this.remove();

            };


        document.body.appendChild(img);


        /*
         * Через 5 секунд убрать.
         */

        wrongPictureTimer =
            setTimeout(() => {

                img.remove();

            }, 5000);

    }


    /*
     * ============================================================
     * ПОСЛЕ ТРЁХ ЗАДАЧ
     * ============================================================
     */

    function showReadyScreen() {

        clearTimers();


        app.innerHTML = `

            <div class="dialog">

                <div class="question">
                    Вы точно готовы узнать это?
                </div>

                <button
                    id="yesBtn"
                    class="active-button"
                >
                    ДА
                </button>

                <div style="height: 12px;"></div>

                <button disabled>
                    НЕТ МНЕ ПОХ
                </button>

            </div>

        `;


        document
            .getElementById("yesBtn")
            .addEventListener(
                "click",
                function () {

                    /*
                     * Звук активной кнопки.
                     */
                    playClickSound();

                    showWaitScreen();

                }
            );

    }


    /*
     * ============================================================
     * ЩА СЕК
     * ============================================================
     */

    function showWaitScreen() {

        clearTimers();


        app.innerHTML = `

            <div class="dialog">

                <div class="wait-text">
                    Ща сек
                </div>

            </div>

        `;


        /*
         * Через 5 секунд следующий экран.
         */

        waitTimer =
            setTimeout(() => {

                showPaymentScreen();

            }, 5000);

    }


    /*
     * ============================================================
     * ЭКРАН ОПЛАТЫ
     * ============================================================
     */

    function showPaymentScreen() {

        app.innerHTML = `

            <div class="dialog">

                <button disabled>
                    УЗНАТЬ БЕСПЛАТНО
                </button>

                <div style="height: 14px;"></div>

                <button
                    id="paidBtn"
                    class="active-button"
                >
                    УЗНАТЬ ЗА 10 ГРЫВЕНЬ
                </button>

            </div>

        `;


        document
            .getElementById("paidBtn")
            .addEventListener(
                "click",
                function () {

                    /*
                     * Звук активной кнопки.
                     */

                    playClickSound();


                    /*
                     * После этого запускаем
                     * music4 + финальный экран.
                     */

                    showFinalScreen();

                }
            );

    }


    /*
     * ============================================================
     * ФИНАЛ
     * ============================================================
     */

    function showFinalScreen() {

        /*
         * Music4.
         */

        playMusic("music4");


        /*
         * Падающие эмодзи.
         */

        startFallingEmojis();


        app.innerHTML = `

            <div class="dialog final-dialog">

                <img
                    class="final-picture"
                    src="assets/picture5.png"
                    alt=""
                    onerror="
                        this.style.display='none'
                    "
                >

                <button
                    id="restartBtn"
                    class="active-button"
                >
                    бля спасибо нахуй
                </button>

            </div>

        `;


        document
            .getElementById("restartBtn")
            .addEventListener(
                "click",
                function () {

                    /*
                     * Звук активной кнопки.
                     */

                    playClickSound();


                    /*
                     * Начинаем всё заново.
                     */

                    restartEverything();

                }
            );

    }


    /*
     * ============================================================
     * ПАДАЮЩИЕ ЭМОДЗИ
     * ============================================================
     */

    function startFallingEmojis() {

        stopFallingEmojis();


        for (let i = 0; i < 18; i++) {

            setTimeout(() => {

                createFallingEmoji();

            }, i * 120);

        }


        fallingInterval =
            setInterval(() => {

                createFallingEmoji();

            }, 300);

    }


    function createFallingEmoji() {

        const item =
            document.createElement("div");


        item.className =
            "falling-item";


        const emojis = [

            "🕸️",
            "🕷️",
            "🕸️",
            "🕷️",
            "🕸️",
            "🕷️",
            "🕸️"

        ];


        item.textContent =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];


        item.style.left =
            Math.random() * 100 + "vw";


        const size =
            25 + Math.random() * 30;


        item.style.fontSize =
            size + "px";


        const duration =
            3 + Math.random() * 5;


        item.style.animationDuration =
            duration + "s";


        item.style.transform =
            `translateY(-100px)
             rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(item);


        setTimeout(() => {

            item.remove();

        }, (duration + 1) * 1000);

    }


    function stopFallingEmojis() {

        if (fallingInterval) {

            clearInterval(
                fallingInterval
            );

            fallingInterval = null;

        }


        document
            .querySelectorAll(
                ".falling-item"
            )
            .forEach(
                item => item.remove()
            );

    }


    /*
     * ============================================================
     * НАЧАТЬ ВСЁ СНАЧАЛА
     * ============================================================
     */

    function restartEverything() {

        stopFallingEmojis();


        /*
         * Останавливаем music4.
         */

        const music4 =
            document.getElementById(
                "music4"
            );


        if (music4) {

            music4.pause();

            music4.currentTime = 0;

        }


        /*
         * ========================================================
         * ФОНОВАЯ МУЗЫКА:
         *
         * По твоему условию при возврате
         * на первый этап она начинается
         * С НАЧАЛА.
         * ========================================================
         */

        const musicBack =
            document.getElementById(
                "musicBack"
            );


        if (musicBack) {

            musicBack.pause();

            musicBack.currentTime = 0;

        }


        /*
         * Сбрасываем прогресс.
         */

        currentTask = 0;


        /*
         * Снова показываем первую задачу.
         */

        showTask();


        /*
         * Запускаем фон.
         *
         * Это сработает, потому что пользователь
         * только что нажал активную кнопку.
         */

        setTimeout(() => {

            startBackgroundMusic();

        }, 50);

    }


    /*
     * ============================================================
     * ОЧИСТКА ТАЙМЕРОВ
     * ============================================================
     */

    function clearTimers() {

        if (wrongPictureTimer) {

            clearTimeout(
                wrongPictureTimer
            );

            wrongPictureTimer = null;

        }


        if (waitTimer) {

            clearTimeout(
                waitTimer
            );

            waitTimer = null;

        }


        document
            .querySelectorAll(
                ".wrong-picture"
            )
            .forEach(
                img => img.remove()
            );

    }

</script>

</body>
</html>
