<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Задачка</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #29272c;
            color: #f3a8d0;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Затемнение/фон */
        .page {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Главное диалоговое окно */
        .dialog {
            width: min(420px, calc(100vw - 40px));
            min-height: 210px;

            background: #3a373d;
            border: 2px solid #514d55;
            border-radius: 14px;

            padding: 30px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);

            position: relative;
            z-index: 10;

            animation: dialogAppear 0.25s ease;
        }

        @keyframes dialogAppear {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .question {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 22px;
            color: #f2a5cd;
        }

        /* Поле ответа */
        .answer-input {
            width: 90px;
            height: 52px;

            background: #29272c;
            color: #f3a8d0;

            border: 2px solid #716b76;
            border-radius: 9px;

            text-align: center;
            font-size: 25px;
            font-weight: bold;

            outline: none;

            margin-bottom: 18px;
        }

        .answer-input:focus {
            border-color: #e78bb8;
            box-shadow: 0 0 0 3px rgba(231, 139, 184, 0.12);
        }

        /* Все кнопки */
        button {
            width: 100%;
            max-width: 280px;

            height: 48px;

            border: none;
            border-radius: 9px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Активная розовая кнопка */
        .active-button {
            background: #f08fbd;
            color: #6b2760;
        }

        .active-button:hover {
            background: #f5a2c9;
        }

        /* Неактивная кнопка */
        button:disabled {
            background: #625b6d;
            color: #e99ac3;
            cursor: not-allowed;
            opacity: 0.9;
        }

        /* Кнопка продолжить */
        #continueBtn {
            margin-top: 2px;
        }

        /* Картинка после неправильного ответа */
        .wrong-picture {
            position: fixed;

            max-width: min(260px, 70vw);
            max-height: 260px;

            object-fit: contain;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 100;

            border-radius: 12px;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);

            animation: pictureAppear 0.2s ease;
        }

        @keyframes pictureAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Экран "Ща сек" */
        .wait-text {
            font-size: 26px;
            font-weight: bold;
            color: #f2a5cd;
            text-align: center;
        }

        /* Финальная сцена */
        .final-dialog {
            min-height: 300px;
        }

        .final-picture {
            width: 100%;
            max-width: 300px;
            max-height: 230px;

            object-fit: contain;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        /* Падающие эмодзи */
        .falling-item {
            position: fixed;

            top: -100px;

            z-index: 5;

            pointer-events: none;

            user-select: none;

            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.95;
            }
        }

        /* На мобильных */
        @media (max-width: 500px) {
            .dialog {
                padding: 25px 20px;
            }

            .question {
                font-size: 21px;
            }

            .wait-text {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div id="app"></div>
</div>

<!-- Звуки -->
<audio id="music1" src="assets/music1.mp3" preload="auto"></audio>
<audio id="music2" src="assets/music2.mp3" preload="auto"></audio>
<audio id="music3" src="assets/music3.mp3" preload="auto"></audio>
<audio id="music4" src="assets/music4.mp3" preload="auto"></audio>

<script>
    /*
     * ============================================================
     * НАСТРОЙКИ
     * ============================================================
     */

    const tasks = [
        {
            question: "решите задачу: 2+2 =",
            answer: "4",
            music: "music1",
            picture: "picture1.png"
        },
        {
            question: "решите задачу: 2*2 =",
            answer: "4",
            music: "music2",
            picture: "picture2.png"
        },
        {
            question: "решите задачу: 2+2**2 =",
            answer: "6",
            music: "music3",
            picture: "picture3.png"
        }
    ];


    /*
     * ============================================================
     * СОСТОЯНИЕ
     * ============================================================
     */

    let currentTask = 0;
    let wrongPictureTimer = null;
    let waitTimer = null;


    /*
     * ============================================================
     * ЭЛЕМЕНТ APP
     * ============================================================
     */

    const app = document.getElementById("app");


    /*
     * ============================================================
     * ЗАПУСК
     * ============================================================
     */

    showTask();


    /*
     * ============================================================
     * ПОКАЗ ЗАДАЧИ
     * ============================================================
     */

    function showTask() {

        clearTimers();

        const task = tasks[currentTask];

        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    ${task.question}
                </div>

                <input
                    id="answerInput"
                    class="answer-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="1"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                >

                <button
                    id="continueBtn"
                    disabled
                >
                    ПРОДОЛЖИТЬ
                </button>

            </div>
        `;

        const input = document.getElementById("answerInput");
        const continueBtn = document.getElementById("continueBtn");


        /*
         * Разрешаем только одну цифру 0-9
         */
        input.addEventListener("input", function () {

            // Удаляем всё, кроме цифр
            this.value = this.value.replace(/[^0-9]/g, "");

            // Оставляем только один символ
            if (this.value.length > 1) {
                this.value = this.value.charAt(0);
            }

            checkAnswer();
        });


        /*
         * Дополнительная защита от ввода букв с клавиатуры
         */
        input.addEventListener("keydown", function (event) {

            const allowedKeys = [
                "Backspace",
                "Delete",
                "ArrowLeft",
                "ArrowRight",
                "Tab"
            ];

            if (
                allowedKeys.includes(event.key) ||
                /^[0-9]$/.test(event.key)
            ) {
                return;
            }

            event.preventDefault();
        });


        /*
         * Проверка вставки
         */
        input.addEventListener("paste", function (event) {

            event.preventDefault();

            const pastedText =
                (event.clipboardData || window.clipboardData)
                .getData("text");

            const digit = pastedText
                .replace(/[^0-9]/g, "")
                .charAt(0);

            this.value = digit;

            checkAnswer();
        });


        /*
         * Нажатие продолжить
         */
        continueBtn.addEventListener("click", function () {

            if (this.disabled) {
                return;
            }

            currentTask++;

            if (currentTask >= tasks.length) {
                showReadyScreen();
            } else {
                showTask();
            }
        });


        /*
         * Автоматически ставим курсор
         */
        setTimeout(() => {
            input.focus();
        }, 100);
    }


    /*
     * ============================================================
     * ПРОВЕРКА ОТВЕТА
     * ============================================================
     */

    function checkAnswer() {

        const input = document.getElementById("answerInput");
        const continueBtn = document.getElementById("continueBtn");

        if (!input || !continueBtn) {
            return;
        }

        const value = input.value;

        /*
         * Правильный ответ
         */
        if (value === tasks[currentTask].answer) {

            continueBtn.disabled = false;
            continueBtn.classList.add("active-button");

            /*
             * Если пользователь потом исправит ответ
             * на неправильный — кнопка снова выключится.
             */
            return;
        }


        /*
         * Пока поле пустое — ничего не делаем
         */
        if (value === "") {

            continueBtn.disabled = true;
            continueBtn.classList.remove("active-button");

            return;
        }


        /*
         * Неправильный ответ
         */
        continueBtn.disabled = true;
        continueBtn.classList.remove("active-button");

        playMusic(tasks[currentTask].music);

        showWrongPicture(tasks[currentTask].picture);

        /*
         * Очищаем поле, чтобы можно было попробовать снова
         */
        setTimeout(() => {

            const currentInput =
                document.getElementById("answerInput");

            if (currentInput) {
                currentInput.value = "";
                currentInput.focus();
            }

        }, 100);
    }


    /*
     * ============================================================
     * ВОСПРОИЗВЕДЕНИЕ ЗВУКА
     * ============================================================
     */

    function playMusic(id) {

        const audio = document.getElementById(id);

        if (!audio) {
            return;
        }

        /*
         * Перематываем в начало,
         * чтобы звук можно было запустить снова.
         */
        audio.currentTime = 0;

        const promise = audio.play();

        /*
         * Если браузер всё-таки заблокировал звук,
         * просто ничего не ломаем.
         */
        if (promise !== undefined) {
            promise.catch(() => {});
        }
    }


    /*
     * ============================================================
     * ПОКАЗ НЕПРАВИЛЬНОЙ КАРТИНКИ
     * ============================================================
     */

    function showWrongPicture(filename) {

        clearTimeout(wrongPictureTimer);

        /*
         * Удаляем предыдущую картинку
         */
        const oldPicture =
            document.querySelector(".wrong-picture");

        if (oldPicture) {
            oldPicture.remove();
        }


        const img = document.createElement("img");

        img.src = "assets/" + filename;
        img.className = "wrong-picture";

        /*
         * Если картинка не загрузилась,
         * она просто не будет отображаться.
         */
        img.onerror = function () {
            this.remove();
        };

        document.body.appendChild(img);


        /*
         * Через 5 секунд убрать картинку
         */
        wrongPictureTimer = setTimeout(() => {

            img.remove();

        }, 5000);
    }


    /*
     * ============================================================
     * ЭКРАН ПОСЛЕ ТРЁХ ЗАДАЧ
     * ============================================================
     */

    function showReadyScreen() {

        clearTimers();

        app.innerHTML = `
            <div class="dialog">

                <div class="question">
                    Вы точно готовы узнать это?
                </div>

                <button
                    id="yesBtn"
                    class="active-button"
                >
                    ДА
                </button>

                <div style="height: 12px;"></div>

                <button disabled>
                    НЕТ МНЕ ПОХ
                </button>

            </div>
        `;


        document
            .getElementById("yesBtn")
            .addEventListener("click", showWaitScreen);
    }


    /*
     * ============================================================
     * "ЩА СЕК"
     * ============================================================
     */

    function showWaitScreen() {

        clearTimers();

        app.innerHTML = `
            <div class="dialog">
                <div class="wait-text">
                    Ща сек
                </div>
            </div>
        `;


        /*
         * Через 5 секунд показываем две кнопки
         */
        waitTimer = setTimeout(() => {

            showPaymentScreen();

        }, 5000);
    }


    /*
     * ============================================================
     * ЭКРАН С КНОПКАМИ
     * ============================================================
     */

    function showPaymentScreen() {

        app.innerHTML = `
            <div class="dialog">

                <button disabled>
                    УЗНАТЬ БЕСПЛАТНО
                </button>

                <div style="height: 14px;"></div>

                <button
                    id="paidBtn"
                    class="active-button"
                >
                    УЗНАТЬ ЗА 10 ГРЫВЕНЬ
                </button>

            </div>
        `;


        document
            .getElementById("paidBtn")
            .addEventListener("click", showFinalScreen);
    }


    /*
     * ============================================================
     * ФИНАЛЬНЫЙ ЭКРАН
     * ============================================================
     */

    function showFinalScreen() {

        /*
         * Музыка 4
         */
        playMusic("music4");


        /*
         * Запускаем падающие эмодзи
         */
        startFallingEmojis();


        app.innerHTML = `
            <div class="dialog final-dialog">

                <img
                    class="final-picture"
                    src="assets/picture5.png"
                    alt=""
                    onerror="this.style.display='none'"
                >

                <button
                    id="restartBtn"
                    class="active-button"
                >
                    бля спасибо нахуй
                </button>

            </div>
        `;


        document
            .getElementById("restartBtn")
            .addEventListener("click", restartEverything);
    }


    /*
     * ============================================================
     * ПАДАЮЩИЕ ЭМОДЗИ
     * ============================================================
     */

    let fallingInterval = null;


    function startFallingEmojis() {

        stopFallingEmojis();

        /*
         * Сначала создаём несколько штук
         */
        for (let i = 0; i < 18; i++) {
            setTimeout(() => {
                createFallingEmoji();
            }, i * 120);
        }


        /*
         * Потом продолжаем создавать новые
         */
        fallingInterval = setInterval(() => {

            createFallingEmoji();

        }, 300);
    }


    function createFallingEmoji() {

        const item = document.createElement("div");

        item.className = "falling-item";


        /*
         * Apple + паутина + паук
         */
        const emojis = [
            "🍎",
            "🍏",
            "🕸️",
            "🕷️",
            "🍎",
            "🕷️",
            "🕸️"
        ];


        item.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];


        /*
         * Случайная позиция
         */
        item.style.left =
            Math.random() * 100 + "vw";


        /*
         * Случайный размер
         */
        const size =
            25 + Math.random() * 30;

        item.style.fontSize = size + "px";


        /*
         * Случайная скорость
         */
        const duration =
            3 + Math.random() * 5;

        item.style.animationDuration =
            duration + "s";


        /*
         * Небольшое случайное вращение
         */
        item.style.transform =
            `translateY(-100px) rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(item);


        /*
         * Удаляем после окончания анимации
         */
        setTimeout(() => {

            item.remove();

        }, (duration + 1) * 1000);
    }


    function stopFallingEmojis() {

        if (fallingInterval) {

            clearInterval(fallingInterval);

            fallingInterval = null;
        }


        document
            .querySelectorAll(".falling-item")
            .forEach(item => item.remove());
    }


    /*
     * ============================================================
     * НАЧАТЬ ВСЁ СНАЧАЛА
     * ============================================================
     */

    function restartEverything() {

        stopFallingEmojis();

        /*
         * Останавливаем музыку 4
         */
        const music4 =
            document.getElementById("music4");

        if (music4) {
            music4.pause();
            music4.currentTime = 0;
        }


        /*
         * Сбрасываем прогресс
         */
        currentTask = 0;


        /*
         * Первый экран
         */
        showTask();
    }


    /*
     * ============================================================
     * ОЧИСТКА ТАЙМЕРОВ
     * ============================================================
     */

    function clearTimers() {

        if (wrongPictureTimer) {
            clearTimeout(wrongPictureTimer);
            wrongPictureTimer = null;
        }

        if (waitTimer) {
            clearTimeout(waitTimer);
            waitTimer = null;
        }


        /*
         * Убираем оставшуюся картинку
         */
        document
            .querySelectorAll(".wrong-picture")
            .forEach(img => img.remove());
    }
</script>

</body>
</html>
